name: HarnessMobile
options:
  bundleIdPrefix: com.llf
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  HarnessMobileCore:
    path: .
targets:
  HarnessMobile:
    type: application
    platform: iOS
    entitlements:
      path: HarnessMobile/HarnessMobile.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobile
        excludes:
          # AI collaboration rules are source-adjacent documentation, not
          # application resources. Keeping them out of the target also avoids
          # colliding `AGENTS.md` bundle names when XcodeGen recurses.
          - App/AGENTS.md
          - Core/Agent/AGENTS.md
          - Core/Plugins/AGENTS.md
          - Resources/PluginHost/node_modules
      # Keep the marketplace transaction coordinator explicit while the
      # project is regenerated from this spec. This file is intentionally
      # outside the generated group layout used by older checkouts.
      - path: HarnessMobile/Core/Plugins/PluginInstallCoordinator.swift
      - path: HarnessMobile/Core/Plugins/ISHHost/ISHNativeClientSlotRegistry.swift
      - path: HarnessMobile/Core/Trace/SessionPersistence.swift
      # Ralph is part of the production tool catalog and must remain in the
      # application target when the project is regenerated.
      - path: HarnessMobile/Core/Tools/RalphTool.swift
      - path: Vendor/OpenMinisISH/Artifacts/alpine-rootfs.zip
        buildPhase: resources
      - path: Vendor/OpenMinisISH/Artifacts/RootfsPatch.bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile
        PRODUCT_NAME: HarnessMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - target: HarnessMobileLiveActivity
        embed: true
      - target: HarnessMobileShare
        embed: true
      - framework: Vendor/OpenMinisISH/Artifacts/HarnessISH.xcframework
        embed: false
      - sdk: HealthKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
      - sdk: libresolv.tbd
    info:
      path: HarnessMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Harness Mobile
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: 仅在你主动拍照并交给本地 OCR 工具时使用相机。
        NSPhotoLibraryUsageDescription: 仅在你主动选择图片供本地 OCR 分析时读取所选内容。
        NSPhotoLibraryAddUsageDescription: 仅在你批准照片工具保存结果时写入照片图库。
        NSContactsUsageDescription: 仅在你批准联系人搜索工具时读取有限的姓名、电话和邮箱。
        NSLocationWhenInUseUsageDescription: 仅在你批准定位工具时获取一次当前定位，不进行后台跟踪。
        NSLocationAlwaysAndWhenInUseUsageDescription: 仅在你明确开启后台粗略定位保活并允许 Always 定位后，于后台任务运行期间使用约 3 公里精度的位置服务；不会存储或显示位置坐标。
        NSMotionUsageDescription: 仅在你批准运动工具时读取最近的本机运动活动估计。
        NSMicrophoneUsageDescription: 仅在你主动使用语音输入时访问麦克风。
        NSSpeechRecognitionUsageDescription: 仅在你主动使用语音转文字时进行语音识别。
        NSCalendarsUsageDescription: 仅在你批准日历工具时查询或修改日程。
        NSCalendarsFullAccessUsageDescription: 仅在你批准日历工具时查询或修改日程。
        NSRemindersUsageDescription: 仅在你批准提醒事项工具时查询或修改提醒。
        NSRemindersFullAccessUsageDescription: 仅在你批准提醒事项工具时查询或修改提醒。
        NSAppleMusicUsageDescription: 仅在你批准媒体工具时访问本机音乐资料库。
        NSBluetoothAlwaysUsageDescription: 仅在你批准蓝牙工具时扫描或连接附近的 BLE 设备。
        NSBluetoothPeripheralUsageDescription: 仅在你批准蓝牙工具时与附近的 BLE 设备通信。
        NSLocalNetworkUsageDescription: 仅在你批准需要访问同一局域网设备的功能时使用本地网络。
        NSHealthShareUsageDescription: 仅在你调用并批准 Apple 健康工具时读取所选健康数据；工具结果会发送给当前配置的模型服务并保存在本机会话中。
        NSHealthUpdateUsageDescription: 仅在你调用并批准 Apple 健康写入工具时写入所选健康数据。
        NSHomeKitUsageDescription: 当前构建未获得 HomeKit capability；取得签名能力后，才会在你批准时查询或控制智能家居配件。
        NFCReaderUsageDescription: 仅在你主动批准 NFC 工具时开启一次系统扫描会话。
        NSFaceIDUsageDescription: 用于在执行敏感本机操作前验证设备所有者。
        BGTaskSchedulerPermittedIdentifiers:
          - com.llf.harnessmobile.continued-processing.*
          - com.llf.harnessmobile.schedule-processing
        UIBackgroundModes:
          - audio
          - location
          - processing
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Device-only tool audit
        script: '"$SRCROOT/Scripts/audit-no-remote-execution.sh"'
        inputFiles:
          - $(SRCROOT)/Scripts/audit-no-remote-execution.sh
        inputFileLists:
          - $(SRCROOT)/Scripts/device-audit-inputs.xcfilelist
        basedOnDependencyAnalysis: false
  HarnessMobileShare:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileShare/HarnessMobileShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileShare
        excludes:
          - Info.plist
          - HarnessMobileShare.entitlements
      - path: HarnessMobile/Core/Storage/ShareHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.share
        PRODUCT_NAME: HarnessMobileShare
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileShare/Info.plist
      properties:
        CFBundleDisplayName: 分享到 Harness
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsMovieWithMaxCount: 8
              NSExtensionActivationSupportsFileWithMaxCount: 8
  HarnessMobileLiveActivity:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileLiveActivity/HarnessMobileLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileLiveActivity
        excludes:
          - Info.plist
          - HarnessMobileLiveActivity.entitlements
      - path: HarnessMobile/Core/Background/HarnessActivityAttributes.swift
      - path: HarnessMobile/Core/Storage/HarnessWidgetProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.liveactivity
        PRODUCT_NAME: HarnessMobileLiveActivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Harness Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HarnessMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessMobileTests
        excludes:
          - AGENTS.md
    dependencies:
      - target: HarnessMobile
      - package: HarnessMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.tests
        GENERATE_INFOPLIST_FILE: YES
  HarnessMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HarnessMobileUITests
    dependencies:
      - target: HarnessMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HarnessMobile:
    build:
      targets:
        HarnessMobile: all
        HarnessMobileTests:
          - test
        HarnessMobileUITests:
          - test
    test:
      targets:
        - HarnessMobileTests
        - HarnessMobileUITests
